<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- audio -->
    <audio id="background-music" loop>
        <source src="assets/gameBG.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <audio id="button-sound">
        <source src="assets/flipcard.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    <audio id="gameWin-sound">
        <source src="assets/completed.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <audio id="gameover-sound">
        <source src="assets/gameOver.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- game board -->
    <div class="container" id="body">

        <!-- top contents -->
        <div class="topContents">

            <!-- high score -->
            <div class="tooltip highScoreDiv" data-tooltip="High Score">
                <svg xmlns="http://www.w3.org/2000/svg" class="bi bi-trophy trophy" viewBox="0 0 16 16">
                    <path
                        d="M2.5.5A.5.5 0 0 1 3 0h10a.5.5 0 0 1 .5.5q0 .807-.034 1.536a3 3 0 1 1-1.133 5.89c-.79 1.865-1.878 2.777-2.833 3.011v2.173l1.425.356c.194.048.377.135.537.255L13.3 15.1a.5.5 0 0 1-.3.9H3a.5.5 0 0 1-.3-.9l1.838-1.379c.16-.12.343-.207.537-.255L6.5 13.11v-2.173c-.955-.234-2.043-1.146-2.833-3.012a3 3 0 1 1-1.132-5.89A33 33 0 0 1 2.5.5m.099 2.54a2 2 0 0 0 .72 3.935c-.333-1.05-.588-2.346-.72-3.935m10.083 3.935a2 2 0 0 0 .72-3.935c-.133 1.59-.388 2.885-.72 3.935M3.504 1q.01.775.056 1.469c.13 2.028.457 3.546.87 4.667C5.294 9.48 6.484 10 7 10a.5.5 0 0 1 .5.5v2.61a1 1 0 0 1-.757.97l-1.426.356a.5.5 0 0 0-.179.085L4.5 15h7l-.638-.479a.5.5 0 0 0-.18-.085l-1.425-.356a1 1 0 0 1-.757-.97V10.5A.5.5 0 0 1 9 10c.516 0 1.706-.52 2.57-2.864.413-1.12.74-2.64.87-4.667q.045-.694.056-1.469z" />
                </svg>
                <span id="highScore" class="highScore">0</span>
            </div>

            <!-- hint -->
            <div class="tooltip hintDiv" data-tooltip="Hint">
                <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi bi-lightbulb hint"
                    viewBox="0 0 16 16" id="hint" onclick="takeHint()">
                    <path
                        d="M2 6a6 6 0 1 1 10.174 4.31c-.203.196-.359.4-.453.619l-.762 1.769A.5.5 0 0 1 10.5 13a.5.5 0 0 1 0 1 .5.5 0 0 1 0 1l-.224.447a1 1 0 0 1-.894.553H6.618a1 1 0 0 1-.894-.553L5.5 15a.5.5 0 0 1 0-1 .5.5 0 0 1 0-1 .5.5 0 0 1-.46-.302l-.761-1.77a2 2 0 0 0-.453-.618A5.98 5.98 0 0 1 2 6m6-5a5 5 0 0 0-3.479 8.592c.263.254.514.564.676.941L5.83 12h4.342l.632-1.467c.162-.377.413-.687.676-.941A5 5 0 0 0 8 1" />
                </svg>
                <span id="hintCount" class="hintCount">0</span>
            </div>
        </div>

        <!-- head text -->
        <h1 class="text-center" id="head">Memory Game</h1>

        <!-- header -->
        <div class="header" id="header">

            <!-- settings -->
            <div class="tooltip boardCtrl" data-tooltip="Settings">
                <svg xmlns="http://www.w3.org/2000/svg" class="bi bi-gear btnS" viewBox="0 0 16 16" id="settings">
                    <path
                        d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492M5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0" />
                    <path
                        d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 0 0 2.693 1.115l.291-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 0 0 1.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 0 0-1.115 2.693l.16.291c.415.764-.42 1.6-1.185 1.184l-.291-.159a1.873 1.873 0 0 0-2.693 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 0 0-2.692-1.115l-.292.16c-.764.415-1.6-.42-1.184-1.185l.159-.291A1.873 1.873 0 0 0 1.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 0 0 3.06 4.377l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 0 0 2.692-1.115z" />
                </svg>
            </div>

            <!-- moves dispaly -->
            <div class="display" id="display">
                <div class="display-text" id="display-text">Moves left</div>
                <div class="display-value" id="display-value"></div>
            </div>

            <!-- pause -->
            <div class="tooltip boardCtrl" data-tooltip="Pause">
                <svg xmlns="http://www.w3.org/2000/svg" class="bi bi-pause-circle btnP" viewBox="0 0 16 16"
                    id="pauseButton">
                    <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16" />
                    <path
                        d="M5 6.25a1.25 1.25 0 1 1 2.5 0v3.5a1.25 1.25 0 1 1-2.5 0zm3.5 0a1.25 1.25 0 1 1 2.5 0v3.5a1.25 1.25 0 1 1-2.5 0z" />
                </svg>
            </div>
        </div>

        <!-- game-board -->
        <div class="board" id="game-board">
            <!-- Cards will be dynamically generated here -->
        </div>
    </div>

    <!-- popup div -->
    <div id="popup" class="popup">

        <!-- home button -->
        <div class="tooltip popupHome" data-tooltip="Home">
            <svg xmlns="http://www.w3.org/2000/svg" class="bi bi-house home" viewBox="0 0 16 16" id="home"
                onclick="closeGame()">
                <path
                    d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293zM13 7.207V13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V7.207l5-5z" />
            </svg>
        </div>

        <!-- popup messages and contents -->
        <div class="popup-content" id="popup-content">
            <p id="popup-emoji" class="popup-emoji"></p>
            <p id="content"></p>
        </div>

        <!-- other buttons -->
        <div class="popup-buttons" id="popupButtons">

            <!-- restart -->
            <div class="tooltip" data-tooltip="Restart">
                <svg xmlns="http://www.w3.org/2000/svg" class="bi bi-arrow-repeat btnPR" viewBox="0 0 16 16"
                    id="restartButton">
                    <path
                        d="M11.534 7h3.932a.25.25 0 0 1 .192.41l-1.966 2.36a.25.25 0 0 1-.384 0l-1.966-2.36a.25.25 0 0 1 .192-.41m-11 2h3.932a.25.25 0 0 0 .192-.41L2.692 6.23a.25.25 0 0 0-.384 0L.342 8.59A.25.25 0 0 0 .534 9" />
                    <path fill-rule="evenodd"
                        d="M8 3c-1.552 0-2.94.707-3.857 1.818a.5.5 0 1 1-.771-.636A6.002 6.002 0 0 1 13.917 7H12.9A5 5 0 0 0 8 3M3.1 9a5.002 5.002 0 0 0 8.757 2.182.5.5 0 1 1 .771.636A6.002 6.002 0 0 1 2.083 9z" />
                </svg>
            </div>

            <!-- resume -->
            <div class="tooltip" data-tooltip="Resume" id="resumeButtonDiv">
                <svg xmlns="http://www.w3.org/2000/svg" class="bi bi-play-circle btnPP" viewBox="0 0 16 16" id="play"
                    class="play">
                    <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16" />
                    <path
                        d="M6.271 5.055a.5.5 0 0 1 .52.038l3.5 2.5a.5.5 0 0 1 0 .814l-3.5 2.5A.5.5 0 0 1 6 10.5v-5a.5.5 0 0 1 .271-.445" />
                </svg>
            </div>
        </div>
    </div>

    <!-- cover div -->
    <div class="cover" id="cover">

        <!-- cover content -->
        <div class="coverContent">

            <!-- title -->
            <h1 class="nameBoard">Memory Game</h1>

            <!-- settings -->
            <div class="tooltip" data-tooltip="Settings">
                <svg xmlns="http://www.w3.org/2000/svg" class="bi bi-gear btnS coverBtnS" viewBox="0 0 16 16"
                    id="coverBtnS">
                    <path
                        d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492M5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0" />
                    <path
                        d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 0 0 2.693 1.115l.291-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 0 0 1.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 0 0-1.115 2.693l.16.291c.415.764-.42 1.6-1.185 1.184l-.291-.159a1.873 1.873 0 0 0-2.693 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 0 0-2.692-1.115l-.292.16c-.764.415-1.6-.42-1.184-1.185l.159-.291A1.873 1.873 0 0 0 1.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 0 0 3.06 4.377l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 0 0 2.692-1.115z" />
                </svg>
            </div>

            <!-- open cover button -->
            <button id="openCovers" class="btn openCoversButton" onclick="openGame()">Play</button>
        </div>
    </div>

    <!-- music div -->
    <div id="settingsDiv" class="settingsDiv">

        <!-- name and close button -->
        <div class="settingsHead">
            <p class="settingsHeadingtext">Settings</p>
            <div class="tooltip SettingsCloseButtonDiv" data-tooltip="close">
                <span id="SettingsCloseButton" class="SettingsCloseButton"> &times; </span>
            </div>
        </div>

        <!-- info div -->
        <p id="settingsInfo" class="settingsInfo"></p>

        <!--BG music control button -->
        <div id="musicButton" class="musicButton">
            <h5>Music</h5>
            <label class="switch" for="music">
                <input type="checkbox" id="music" class="myCheckbox" checked>
                <span class="slider round"></span>
            </label>
        </div>

        <!-- Other sound control button -->
        <div id="soundButton" class="musicButton">
            <h5>Sound</h5>
            <label class="switch" for="sound">
                <input type="checkbox" id="sound" class="myCheckbox" checked>
                <span class="slider round"></span>
            </label>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>

</html>
